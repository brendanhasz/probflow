# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ['3.6', '3.7', '3.8']
        backend: [tensorflow, pytorch]
        os: [ubuntu-latest] #, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies, ${{ matrix.backend }}, and probflow
      run: |
        uv sync --extra ${{ matrix.backend }}
    - name: Lint with ruff
      run: |
        uv run ruff check src/probflow tests
    - name: Style checks with ruff format
      run: |
        uv run ruff format --check src/probflow tests
    - name: Run tests
      run: |
        uv run pytest tests/unit/${{ matrix.backend }} --cov=probflow --cov-report xml:coverage.xml
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
    - name: Ensure the package builds
      run: |
        uv build

