# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  code-quality: write

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        backend: [tensorflow, pytorch]
        #os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up uv
      uses: astral-sh/setup-uv@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies, ${{ matrix.backend }}, and probflow
      run: |
        uv sync --extra ${{ matrix.backend }}
    - name: Lint with ruff
      run: |
        uv run ruff check src/probflow tests
    - name: Run tests
      run: |
        uv run pytest tests/unit/${{ matrix.backend }} --cov=probflow --cov-report xml:coverage.xml
    - name: Upload coverage report
      uses: actions/upload-code-coverage@v1
      with:
        file: coverage.xml
        language: Python
        label: code-coverage/pytest/${{ matrix.python-version }}/${{ matrix.backend }}
    - name: Ensure the package builds
      run: |
        uv build

