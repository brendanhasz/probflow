# This workflow will install Python dependencies, lint, check docs build, and run tests with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  code-quality: write

jobs:
  # Lint code
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Run pre-commit
      uses: pre-commit/action@v3.0.1

  # Build docs
  docs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up uv
      uses: astral-sh/setup-uv@v10.1.0
    - name: Install dependencies
      run: |
        uv sync --extra docs
    - name: Build docs
      run: |
        uv run sphinx-build -b html docs docs/_html

  # Run unit tests w/ different backends and python versions
  unit-test:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
        backend: [tensorflow, pytorch]
        #os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up uv
      uses: astral-sh/setup-uv@v10.1.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies, ${{ matrix.backend }}, and probflow
      run: |
        uv sync --extra ${{ matrix.backend }}
    - name: Run tests
      run: |
        uv run pytest tests/unit/${{ matrix.backend }} --cov=probflow --cov-report xml:coverage.xml
    - name: Upload coverage report to CodeCov
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
    - name: Ensure the package builds
      run: |
        uv build
