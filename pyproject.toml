[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "probflow"
version = "2.4.1"
description = "A Python package for building Bayesian models with TensorFlow or PyTorch"
readme = { file = "README.rst", content-type = "text/x-rst" }
license = "MIT"
authors = [{ name = "Brendan Hasz", email = "winsto99@gmail.com" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
]
dependencies = [
    "matplotlib >= 3.1.0",
    "numpy >= 1.17.0",
    "pandas >= 0.25.0",
    "cloudpickle >= 1.3",
]

[project.urls]
Homepage = "https://github.com/brendanhasz/probflow"

[project.optional-dependencies]
tensorflow = [
    "tensorflow >= 2.2.0",
    "tensorflow-probability >= 0.10.0",
    "tf_keras",
]
pytorch = [
    "torch >= 1.5.0",
]
docs = [
    "tensorflow >= 2.2.0",
    "tensorflow-probability >= 0.10.0",
    "sphinx >= 3.1.2",
    "sphinx-tabs >= 1.1.13",
    "sphinx_rtd_theme >= 0.5.0",
]

[dependency-groups]
dev = [
    "ruff >= 0.6.0",
    "pytest >= 6.0.0rc1",
    "pytest-cov >= 2.7.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/probflow"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
ignore = ["B006", "B008", "E203", "E501", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
"src/probflow/__init__.py" = ["F401", "F403"]

[tool.pytest.ini_options]
addopts = "-p no:warnings"
